<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div>
          <h1>Skill Studio</h1>
          <p class="hero-subtitle">上传、管理 skills.md，并让 Agent 按技能上下文稳定作答</p>
        </div>
        <div class="top-actions">
          <button id="importBtn" class="btn ghost" type="button">导入 skills.md</button>
          <input id="fileInput" type="file" accept=".md,.markdown,text/markdown" hidden />
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="userBadge" class="badge">用户：-</span>
        <span id="modeBadge" class="badge accent">生效模式：-</span>
        <span id="countBadge" class="badge">技能数：-</span>
      </section>

      <main class="layout">
        <section class="panel uploader-panel">
          <h2>文件上传</h2>
          <div id="dropZone" class="drop-zone" role="button" tabindex="0">
            <p class="drop-title">拖拽 skills.md 到这里</p>
            <p class="drop-sub">或点击选择文件</p>
            <button id="selectFileBtn" class="btn secondary" type="button">选择文件</button>
          </div>
          <p id="uploadHint" class="hint">支持 Markdown 文件上传，上传后会按技能名更新并参与路由。</p>
        </section>

        <section class="panel manager-panel">
          <div class="section-head">
            <h2>技能管理</h2>
            <div class="inline-actions">
              <button id="batchDeleteBtn" class="btn danger" type="button">删除选中</button>
            </div>
          </div>

          <div class="toolbar">
            <label class="check-wrap">
              <input id="selectAllCheckbox" type="checkbox" />
              <span>全选</span>
            </label>
            <input id="searchInput" type="search" placeholder="搜索技能名称/标签" />
          </div>
          <div id="skillList" class="skill-list" aria-live="polite"></div>
          <p id="emptyState" class="empty-state">当前暂无可展示技能，请先上传 skills.md。</p>
        </section>

        <section class="panel chat-panel">
          <div class="section-head">
            <h2>Agent 对话</h2>
            <span id="chatModeTip" class="chat-mode-tip">路由模式：-</span>
          </div>
          <div id="chatWindow" class="chat-window"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" maxlength="500" placeholder="输入问题，例如：如何提升这个技能的项目实战能力？" />
            <button class="btn" type="submit">发送</button>
          </form>
        </section>
      </main>
    </div>

    <a
      class="deerflow-signature"
      href="https://deerflow.tech"
      target="_blank"
      rel="noreferrer"
    >
      Created By Deerflow
    </a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
