<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Login/Register Overlay -->
    <div id="authOverlay" class="auth-overlay">
      <div class="auth-card">
        <h1 class="auth-title">SQL Assistant</h1>
        <p class="auth-subtitle">登录后开始使用 NL2SQL 助手</p>
        <form id="authForm" class="auth-form">
          <div class="auth-field">
            <label>用户名</label>
            <input id="authUsername" type="text" placeholder="请输入用户名" autocomplete="username" />
          </div>
          <div class="auth-field">
            <label>密码</label>
            <input id="authPassword" type="password" placeholder="请输入密码" autocomplete="current-password" />
          </div>
          <div class="auth-actions">
            <button id="loginBtn" class="btn" type="submit">登录</button>
            <button id="registerBtn" class="btn secondary" type="button">注册</button>
          </div>
          <p id="authError" class="auth-error"></p>
        </form>
      </div>
    </div>

    <!-- Main App (hidden until logged in) -->
    <div id="appShell" class="app-shell" style="display:none">
      <header class="top-bar">
        <div>
          <h1>Skill Studio</h1>
          <p class="hero-subtitle">上传、管理 skills.md，并让 Agent 按技能上下文稳定作答</p>
        </div>
        <div class="top-actions">
          <span id="currentUser" class="badge"></span>
          <button id="logoutBtn" class="btn ghost" type="button">退出</button>
          <button id="importBtn" class="btn ghost" type="button">导入 skills.md</button>
          <input id="fileInput" type="file" accept=".md,.markdown,text/markdown" hidden />
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <span id="userBadge" class="badge">用户：-</span>
        <span id="modeBadge" class="badge accent">生效模式：-</span>
        <span id="countBadge" class="badge">技能数：-</span>
      </section>

      <main class="layout">
        <section class="panel db-panel">
          <h2>数据库连接</h2>
          <div class="db-status-row">
            <span id="dbStatusBadge" class="badge">未连接</span>
          </div>
          <form id="dbForm" class="db-form">
            <div class="db-field">
              <label>Host</label>
              <input id="dbHost" type="text" placeholder="127.0.0.1" value="127.0.0.1" />
            </div>
            <div class="db-field">
              <label>Port</label>
              <input id="dbPort" type="number" placeholder="3306" value="3306" />
            </div>
            <div class="db-field">
              <label>User</label>
              <input id="dbUser" type="text" placeholder="root" />
            </div>
            <div class="db-field">
              <label>Password</label>
              <input id="dbPassword" type="password" placeholder="密码" />
            </div>
            <div class="db-field">
              <label>Database</label>
              <input id="dbDatabase" type="text" placeholder="数据库名" />
            </div>
            <div class="db-actions">
              <button id="dbConnectBtn" class="btn" type="submit">连接</button>
              <button id="dbDisconnectBtn" class="btn danger" type="button" style="display:none">断开</button>
            </div>
          </form>
          <div id="dbTablesPreview" class="db-tables-preview" style="display:none">
            <h3>表列表</h3>
            <div id="dbTablesList" class="db-tables-list"></div>
          </div>
        </section>

        <section class="panel uploader-panel">
          <h2>文件上传</h2>
          <div id="dropZone" class="drop-zone" role="button" tabindex="0">
            <p class="drop-title">拖拽 skills.md 到这里</p>
            <p class="drop-sub">或点击选择文件</p>
            <button id="selectFileBtn" class="btn secondary" type="button">选择文件</button>
          </div>
          <p id="uploadHint" class="hint">支持 Markdown 文件上传，上传后会按技能名更新并参与路由。</p>
        </section>

        <section class="panel manager-panel">
          <div class="section-head">
            <h2>技能管理</h2>
            <div class="inline-actions">
              <button id="batchDeleteBtn" class="btn danger" type="button">删除选中</button>
            </div>
          </div>

          <div class="toolbar">
            <label class="check-wrap">
              <input id="selectAllCheckbox" type="checkbox" />
              <span>全选</span>
            </label>
            <input id="searchInput" type="search" placeholder="搜索技能名称/标签" />
          </div>
          <div id="skillList" class="skill-list" aria-live="polite"></div>
          <p id="emptyState" class="empty-state">当前暂无可展示技能，请先上传 skills.md。</p>
        </section>

        <section class="panel chat-panel">
          <div class="section-head">
            <h2>Agent 对话</h2>
            <span id="chatModeTip" class="chat-mode-tip">路由模式：-</span>
          </div>
          <div id="chatWindow" class="chat-window"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" maxlength="500" placeholder="输入问题，例如：如何提升这个技能的项目实战能力？" />
            <button class="btn" type="submit">发送</button>
          </form>
        </section>
      </main>
    </div>

    <a
      class="deerflow-signature"
      href="https://deerflow.tech"
      target="_blank"
      rel="noreferrer"
    >
      Created By Deerflow
    </a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
