[project]
name = "sql-assistant-agent"
version = "0.1.0"
description = "FastAPI + LangGraph based SQL assistant with filesystem skills storage, skills.md upload, and skill routing middleware"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "filelock>=3.16.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.1",
    "jsonpointer>=3.0.0",
    "dashscope>=1.25.17",
]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true
